name: Test Baton Gitlab Integration

on: pull_request

jobs:
  go-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run linters
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=3m

  go-test:
    strategy:
      matrix:
        go-version: [1.23.x]
        platform: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Install Go
        if: success()
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Checkout code
        uses: actions/checkout@v4
      - name: go tests
        run: go test -v -covermode=count -json ./... > test.json
      - name: Print go test results
        if: always()
        run: cat test.json
      - name: annotate go tests
        if: always()
        uses: guyarb/golang-test-annotations@v0.8.0
        with:
          test-results: test.json

  test-DC-version:
    runs-on: ubuntu-latest
    services:
      gitlab:
        image: gitlab/gitlab-ce:latest
        ports:
          - 8080:80
        options: >-
          --hostname localhost
          --health-cmd "curl -sSf http://localhost:8080/users/sign_in || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
        env:
          GITLAB_ROOT_PASSWORD: rootpassword123

    env:
      GITLAB_URL: http://localhost:8080
      GITLAB_ROOT_PASSWORD: rootpassword123

    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Wait for GitLab to be ready
        run: |
          until curl -sSf "$GITLAB_URL/users/sign_in"; do
            echo "Waiting for GitLab..."
            sleep 10
          done

      - name: Login and get cookie
        run: |
          curl -c cookies.txt -d "user[login]=root&user[password]=$GITLAB_ROOT_PASSWORD" \
            -X POST "$GITLAB_URL/users/sign_in" -o login.html
          grep "Sign in" login.html && (echo "Login failed" && exit 1) || echo "Login succeeded"

      - name: Create Personal Access Token via API
        run: |
          curl -b cookies.txt -H "Content-Type: application/json" \
            -d '{"name":"test-token","scopes":["api"]}' \
            -X POST "$GITLAB_URL/api/v4/personal_access_tokens" -o pat.json
          cat pat.json
          TOKEN=$(jq -r '.token' pat.json)
          if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then
            echo "Failed to create PAT"
            exit 1
          fi
          echo "PAT=$TOKEN" >> $GITHUB_ENV

      - name: Validate token works
        run: |
          curl --fail --header "PRIVATE-TOKEN: $PAT" "$GITLAB_URL/api/v4/user"

      - name: Setup test data
        run: |
          TOKEN=$PAT
          curl -H "PRIVATE-TOKEN: $TOKEN" \
            --data "name=test-group&path=test-group" \
            "$GITLAB_URL/api/v4/groups" -o group.json
          echo "GROUP_ID=$(jq -r '.id' group.json)" >> $GITHUB_ENV
          
          curl -H "PRIVATE-TOKEN: $TOKEN" \
            --data "name=test-project&namespace_id=$(jq -r '.id' group.json)" \
            "$GITLAB_URL/api/v4/projects" -o project.json
          echo "PROJECT_ID=$(jq -r '.id' project.json)" >> $GITHUB_ENV
          
          curl -H "PRIVATE-TOKEN: $TOKEN" \
            --data "email=test@example.com&username=testuser&name=Test User&password=Test1234" \
            "$GITLAB_URL/api/v4/users" -o user.json
          echo "USER_ID=$(jq -r '.id' user.json)" >> $GITHUB_ENV
          
          curl --request POST "$GITLAB_URL/api/v4/projects/$(jq -r '.id' project.json)/members" \
            --header "PRIVATE-TOKEN: $TOKEN" \
            --data "user_id=$(jq -r '.id' user.json)&access_level=20"
          
          curl --request POST "$GITLAB_URL/api/v4/groups/$(jq -r '.id' group.json)/members" \
            --header "PRIVATE-TOKEN: $TOKEN" \
            --data "user_id=$(jq -r '.id' user.json)&access_level=40"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.x

      - name: Build baton-gitlab
        run: go build ./cmd/baton-gitlab

      - name: Install baton
        run: ./scripts/get-baton.sh && sudo mv baton /usr/local/bin

      - name: Export Baton env vars
        run: |
          echo "BATON_GITLAB_BASE_URL=$GITLAB_URL" >> $GITHUB_ENV
          echo "BATON_GITLAB_BEARER_TOKEN=$PAT" >> $GITHUB_ENV

      # PROJECT tests: revoke, check, grant
      - name: Revoke project grant
        run: ./baton-gitlab --revoke-grant="project:${{ env.PROJECT_ID }}:Reporter:user:${{ env.USER_ID }}"

      - name: Assert project grant revoked
        run: |
          ./baton-gitlab
          baton grants --entitlement="project:${{ env.PROJECT_ID }}:Reporter" --output-format=json | \
            jq --exit-status "if .grants then .grants[]?.principal.id.resource != \"${{ env.USER_ID }}\" else . end"

      - name: Grant project entitlement again
        run: |
          ./baton-gitlab --grant-entitlement="project:${{ env.PROJECT_ID }}:Reporter" \
                         --grant-principal="${{ env.USER_ID }}" \
                         --grant-principal-type="user"

      - name: Assert project grant exists
        run: |
          ./baton-gitlab
          baton grants --entitlement="project:${{ env.PROJECT_ID }}:Reporter" --output-format=json | \
            jq --exit-status ".grants[].principal.id.resource == \"${{ env.USER_ID }}\""

      # GROUP tests: revoke, check, grant
      - name: Revoke group grant
        run: ./baton-gitlab --revoke-grant="group:${{ env.GROUP_ID }}:Maintainer:user:${{ env.USER_ID }}"

      - name: Assert group grant revoked
        run: |
          ./baton-gitlab
          baton grants --entitlement="group:${{ env.GROUP_ID }}:Maintainer" --output-format=json | \
            jq --exit-status "if .grants then .grants[]?.principal.id.resource != \"${{ env.USER_ID }}\" else . end"

      - name: Grant group entitlement again
        run: |
          ./baton-gitlab --grant-entitlement="group:${{ env.GROUP_ID }}:Maintainer" \
                         --grant-principal="${{ env.USER_ID }}" \
                         --grant-principal-type="user"

      - name: Assert group grant exists
        run: |
          ./baton-gitlab
          baton grants --entitlement="group:${{ env.GROUP_ID }}:Maintainer" --output-format=json | \
            jq --exit-status ".grants[].principal.id.resource == \"${{ env.USER_ID }}\""

  test-cloud-version:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target:
          - name: groups
            grant: "group:g/100021949:Maintainer:user:25334081"
            entitlement: "group:g/100021949:Maintainer"
            principal: "25334081"
            principal_type: "user"
          - name: projects
            grant: "project:65850627:Reporter:user:25334081"
            entitlement: "project:65850627:Reporter"
            principal: "25334081"
            principal_type: "user"

    env:
      BATON_LOG_LEVEL: debug
      BATON_ACCESS_TOKEN: "${{ secrets.BATON_ACCESS_TOKEN }}"
      BATON_GITLAB_GROUP_FLAG: "${{ vars.GROUP_FLAG }}"

    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.x

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build baton-gitlab
        run: go build ./cmd/baton-gitlab

      - name: Install baton
        run: ./scripts/get-baton.sh && sudo mv baton /usr/local/bin

      - name: Set matrix variables
        run: |
          echo "CONNECTOR_GRANT=${{ matrix.target.grant }}" >> $GITHUB_ENV
          echo "CONNECTOR_ENTITLEMENT=${{ matrix.target.entitlement }}" >> $GITHUB_ENV
          echo "CONNECTOR_PRINCIPAL=${{ matrix.target.principal }}" >> $GITHUB_ENV
          echo "CONNECTOR_PRINCIPAL_TYPE=${{ matrix.target.principal_type }}" >> $GITHUB_ENV

      - name: Run baton-gitlab
        run: ./baton-gitlab --access-token="${{ env.BATON_ACCESS_TOKEN }}" --account-creation-group="${{ env.BATON_GITLAB_GROUP_FLAG }}"


      - name: Check for grant before revoking
        run: |
          baton grants \
            --access-token="${{ env.BATON_ACCESS_TOKEN }}" \
            --account-creation-group="${{ env.BATON_GITLAB_GROUP_FLAG }}" \
            --entitlement="${{ env.CONNECTOR_ENTITLEMENT }}" \
            --output-format=json | \
          jq --exit-status ".grants[].principal.id.resource == \"${{ env.CONNECTOR_PRINCIPAL }}\""

      - name: Revoke grants
        run: ./baton-gitlab \
          --access-token="${{ env.BATON_ACCESS_TOKEN }}" \
          --account-creation-group="${{ env.BATON_GITLAB_GROUP_FLAG }}" \
          --revoke-grant="${{ env.CONNECTOR_GRANT }}"

      - name: Check grant was revoked
        run: |
          ./baton-gitlab \
            --access-token="${{ env.BATON_ACCESS_TOKEN }}" \
            --account-creation-group="${{ env.BATON_GITLAB_GROUP_FLAG }}" && \
          baton grants \
            --access-token="${{ env.BATON_ACCESS_TOKEN }}" \
            --account-creation-group="${{ env.BATON_GITLAB_GROUP_FLAG }}" \
            --entitlement="${{ env.CONNECTOR_ENTITLEMENT }}" \
            --output-format=json | \
          jq --exit-status "if .grants then .grants[]?.principal.id.resource != \"${{ env.CONNECTOR_PRINCIPAL }}\" else . end"

      - name: Grant entitlement
        run: ./baton-gitlab \
          --access-token="${{ env.BATON_ACCESS_TOKEN }}" \
          --account-creation-group="${{ env.BATON_GITLAB_GROUP_FLAG }}" \
          --grant-entitlement="${{ env.CONNECTOR_ENTITLEMENT }}" \
          --grant-principal="${{ env.CONNECTOR_PRINCIPAL }}" \
          --grant-principal-type="${{ env.CONNECTOR_PRINCIPAL_TYPE }}"

      - name: Check grant was re-granted
        run: |
          ./baton-gitlab \
            --access-token="${{ env.BATON_ACCESS_TOKEN }}" \
            --account-creation-group="${{ env.BATON_GITLAB_GROUP_FLAG }}" && \
          baton grants \
            --access-token="${{ env.BATON_ACCESS_TOKEN }}" \
            --account-creation-group="${{ env.BATON_GITLAB_GROUP_FLAG }}" \
            --entitlement="${{ env.CONNECTOR_ENTITLEMENT }}" \
            --output-format=json | \
          jq --exit-status ".grants[].principal.id.resource == \"${{ env.CONNECTOR_PRINCIPAL }}\""

